<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CyberRange — Modes Reel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{ --reel-bg:#0a0a0a; --reel-ink:#FAFAFA; }
    :root[data-theme="light"]{ --reel-bg:oklch(98% 0 0); --reel-ink:oklch(16% 0 0); }
    html,body{margin:0;padding:0;background:var(--reel-bg);color:var(--reel-ink);font-family:'Geist',system-ui,sans-serif;font-weight:300;overflow:hidden;height:100%;}
    @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.75);}}
    #root{width:100vw;height:100vh;}
  </style>
  <script>
    (function(){
      var apply=function(t){document.documentElement.dataset.theme=(t==='light'?'light':'dark');};
      try{ apply(localStorage.getItem('cr-theme')); }catch(e){ apply('dark'); }
      window.addEventListener('storage',function(e){ if(e.key==='cr-theme') apply(e.newValue); });
      window.addEventListener('message',function(e){ if(e.data&&e.data.crTheme) apply(e.data.crTheme); });
    })();
  </script>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- ── Timeline engine (lifted verbatim from battle-reel.html) ─────────────── -->
<script type="text/babel">
const Easing={
  linear:(t)=>t,
  easeInQuad:(t)=>t*t,easeOutQuad:(t)=>t*(2-t),easeInOutQuad:(t)=>t<0.5?2*t*t:-1+(4-2*t)*t,
  easeInCubic:(t)=>t*t*t,easeOutCubic:(t)=>(--t)*t*t+1,easeInOutCubic:(t)=>t<0.5?4*t*t*t:(t-1)*(2*t-2)*(2*t-2)+1,
  easeInQuart:(t)=>t*t*t*t,easeOutQuart:(t)=>1-(--t)*t*t*t,
  easeInExpo:(t)=>t===0?0:Math.pow(2,10*(t-1)),easeOutExpo:(t)=>t===1?1:1-Math.pow(2,-10*t),
  easeInSine:(t)=>1-Math.cos((t*Math.PI)/2),easeOutSine:(t)=>Math.sin((t*Math.PI)/2),easeInOutSine:(t)=>-(Math.cos(Math.PI*t)-1)/2,
  easeOutBack:(t)=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
  easeInBack:(t)=>{const c1=1.70158,c3=c1+1;return c3*t*t*t-c1*t*t;},
  easeInOutBack:(t)=>{const c1=1.70158,c2=c1*1.525;return t<0.5?(Math.pow(2*t,2)*((c2+1)*2*t-c2))/2:(Math.pow(2*t-2,2)*((c2+1)*(t*2-2)+c2)+2)/2;},
  easeOutElastic:(t)=>{const c4=(2*Math.PI)/3;if(t===0)return 0;if(t===1)return 1;return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*c4)+1;},
};
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function interpolate(input,output,ease=Easing.linear){
  return(t)=>{
    if(t<=input[0])return output[0];
    if(t>=input[input.length-1])return output[output.length-1];
    for(let i=0;i<input.length-1;i++){
      if(t>=input[i]&&t<=input[i+1]){
        const span=input[i+1]-input[i];const local=span===0?0:(t-input[i])/span;
        const ef=Array.isArray(ease)?(ease[i]||Easing.linear):ease;
        return output[i]+(output[i+1]-output[i])*ef(local);
      }
    }
    return output[output.length-1];
  };
}
const TimelineContext=React.createContext({time:0,duration:10,playing:false});
const useTime=()=>React.useContext(TimelineContext).time;
const useTimeline=()=>React.useContext(TimelineContext);
const SpriteContext=React.createContext({localTime:0,progress:0,duration:0});
const useSprite=()=>React.useContext(SpriteContext);
function Sprite({start=0,end=Infinity,children,keepMounted=false}){
  const{time}=useTimeline();const visible=time>=start&&time<=end;
  if(!visible&&!keepMounted)return null;
  const duration=end-start;const localTime=Math.max(0,time-start);
  const progress=duration>0&&isFinite(duration)?clamp(localTime/duration,0,1):0;
  const value={localTime,progress,duration,visible};
  return<SpriteContext.Provider value={value}>{typeof children==='function'?children(value):children}</SpriteContext.Provider>;
}

// ── Clean stage: fills the iframe, scales the canvas to "contain", no controls.
function StageClean({width=1000,height=1250,duration=22,background='var(--reel-bg)',loop=true,children}){
  const[time,setTime]=React.useState(0);
  const[scale,setScale]=React.useState(1);
  const[started,setStarted]=React.useState(false);
  const wrapRef=React.useRef(null),rafRef=React.useRef(null),lastTsRef=React.useRef(null);
  // hold the reel on frame 0 until the host page says the FOUR MODES section is in view;
  // when opened directly (not embedded) just play immediately
  React.useEffect(()=>{
    if(window.self===window.top){setStarted(true);return;}
    const onMsg=(e)=>{if(e.data&&e.data.crPlay)setStarted(true);};
    window.addEventListener('message',onMsg);
    try{window.parent.postMessage({crReady:true},'*');}catch(_){}
    return()=>window.removeEventListener('message',onMsg);
  },[]);
  React.useEffect(()=>{
    if(!wrapRef.current)return;
    const el=wrapRef.current;
    const measure=()=>{const s=Math.min(el.clientWidth/width,el.clientHeight/height);setScale(Math.max(0.05,s));};
    measure();const ro=new ResizeObserver(measure);ro.observe(el);window.addEventListener('resize',measure);
    return()=>{ro.disconnect();window.removeEventListener('resize',measure);};
  },[width,height]);
  React.useEffect(()=>{
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){setTime(duration*0.07);return;}
    if(!started)return;
    const step=(ts)=>{
      if(lastTsRef.current==null)lastTsRef.current=ts;
      const dt=(ts-lastTsRef.current)/1000;lastTsRef.current=ts;
      setTime((t)=>{let n=t+dt;if(n>=duration){n=loop?n%duration:duration;}return n;});
      rafRef.current=requestAnimationFrame(step);
    };
    rafRef.current=requestAnimationFrame(step);
    return()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);lastTsRef.current=null;};
  },[duration,loop,started]);
  const ctxValue=React.useMemo(()=>({time,duration,playing:true}),[time,duration]);
  const ended = !loop && time >= duration - 0.05;
  const replay = () => { lastTsRef.current = null; setTime(0); };
  return(
    <div ref={wrapRef} style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',background:'var(--reel-bg)'}}>
      <div style={{width,height,background,position:'relative',transform:`scale(${scale})`,transformOrigin:'center',flexShrink:0,overflow:'hidden'}}>
        <TimelineContext.Provider value={ctxValue}>{children}</TimelineContext.Provider>
      </div>
      <button onClick={replay} aria-label="Replay" title="Replay" style={{
        position:'absolute', top:16, right:18, width:38, height:38, borderRadius:'50%',
        display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer',
        background:'color-mix(in oklch, var(--reel-bg) 70%, transparent)',
        border:'1px solid color-mix(in oklch, var(--reel-ink) 22%, transparent)',
        color:'var(--reel-ink)', backdropFilter:'blur(6px)', WebkitBackdropFilter:'blur(6px)',
        opacity: ended ? 1 : 0, pointerEvents: ended ? 'auto' : 'none',
        transition:'opacity .4s ease', zIndex:5 }}>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" />
        </svg>
      </button>
    </div>
  );
}
Object.assign(window,{Easing,interpolate,clamp,TimelineContext,useTime,useTimeline,Sprite,SpriteContext,useSprite,StageClean});
</script>

<!-- ── The reel ───────────────────────────────────────────────────────────── -->
<script type="text/babel">
const ATK   = 'oklch(62% 0.24 25)';     // attacker red
const DEF   = 'oklch(70% 0.18 150)';    // emerald — primary accent
const CYAN  = 'oklch(72% 0.13 215)';    // analyze blue (mirrors site --cyan)
const GOLD  = 'oklch(80% 0.16 90)';     // learn warm
const INK   = 'var(--reel-ink)';
const MUTED = 'color-mix(in oklch, var(--reel-ink) 42%, transparent)';
const FAINT = 'color-mix(in oklch, var(--reel-ink) 28%, transparent)';

const SERIF = 'Instrument Serif, serif';
const SANS  = 'Geist, sans-serif';
const MONO  = 'Geist Mono, monospace';

// append an alpha channel to an oklch() color string (so glows actually render)
const withA = (c, a) => c.startsWith('oklch(') ? c.replace(/\)\s*$/, ` / ${a})`) : c;

// fade helper shared by every scene
const useFade = (lead=0.32) => {
  const { localTime, duration } = useSprite();
  return 1 - clamp((localTime - (duration - lead)) / lead, 0, 1);
};

// ── Shared dark mesh background (lifted from battle-reel) ──────────────────────
function DarkMesh({ phase = 1, tealStrength = 1 }) {
  const t = useTime();
  const driftX = Math.sin((t / 14) * Math.PI * 2) * 50;
  const driftY = Math.cos((t / 14) * Math.PI * 2) * 34;
  const pulse  = 0.85 + 0.15 * Math.sin((t / 6) * Math.PI * 2);
  return (
    <div style={{ position: 'absolute', inset: 0, background: 'var(--reel-bg)', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', width: 1100, height: 1100, left: -260, top: -300, borderRadius: '50%',
        background: 'radial-gradient(circle, oklch(55% 0.14 200) 0%, transparent 65%)',
        filter: 'blur(100px)', opacity: 0.26 * phase * tealStrength }} />
      <div style={{ position: 'absolute', width: 1200, height: 1200, right: -340, top: -180, borderRadius: '50%',
        background: 'radial-gradient(circle, oklch(70% 0.18 150) 0%, transparent 65%)',
        filter: 'blur(110px)', opacity: 0.20 * phase }} />
      <div style={{ position: 'absolute', width: 1000, height: 1000, left: 200 + driftX, bottom: -440 + driftY, borderRadius: '50%',
        background: 'radial-gradient(circle, oklch(80% 0.19 130) 0%, transparent 65%)',
        filter: 'blur(90px)', opacity: 0.16 * phase * pulse }} />
    </div>
  );
}

// ── VM screen illustration (lifted from battle-reel) ──────────────────────────
function VMScreen({ color, label, op, scanT = 0 }) {
  return (
    <div style={{ opacity: op, willChange: 'opacity', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
      <div style={{
        width: 196, height: 130, border: `1px solid ${color}`, borderRadius: 12,
        background: 'rgba(0,0,0,0.55)', boxShadow: `0 0 30px -4px ${withA(color,0.33)}, inset 0 0 20px ${withA(color,0.04)}`,
        display: 'flex', flexDirection: 'column', overflow: 'hidden', position: 'relative' }}>
        <div style={{ height: 24, borderBottom: `1px solid ${withA(color,0.19)}`, background: `${withA(color,0.09)}`,
          display: 'flex', alignItems: 'center', paddingLeft: 11, gap: 6, flexShrink: 0 }}>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: color, opacity: 0.85 }} />
          <div style={{ flex: 1, height: 1, background: `${withA(color,0.19)}`, borderRadius: 1, marginRight: 12 }} />
        </div>
        <div style={{ flex: 1, padding: '12px 14px', display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div style={{ height: 3, width: '70%', background: `${withA(color,0.31)}`, borderRadius: 2 }} />
          <div style={{ height: 3, width: '50%', background: `${withA(color,0.21)}`, borderRadius: 2 }} />
          <div style={{ height: 3, width: '62%', background: `${withA(color,0.21)}`, borderRadius: 2 }} />
          <div style={{ height: 3, width: '38%', background: `${withA(color,0.16)}`, borderRadius: 2 }} />
        </div>
        {/* scanline */}
        <div style={{ position: 'absolute', left: 0, right: 0, top: `${24 + scanT * 100}px`, height: 1,
          background: `linear-gradient(90deg, transparent, ${color}, transparent)`, opacity: 0.6 }} />
      </div>
      <div style={{ fontFamily: MONO, fontSize: 12, letterSpacing: '0.22em', color, opacity: 0.7 }}>{label}</div>
    </div>
  );
}

// ── Mode chrome: the number + tag eyebrow that tops every mode scene ──────────
function ModeEyebrow({ num, tag, color, op, y }) {
  return (
    <div style={{ opacity: op, transform: `translateY(${y}px)`, willChange: 'transform,opacity',
      display: 'flex', alignItems: 'center', gap: 18 }}>
      <span style={{ fontFamily: MONO, fontSize: 26, fontWeight: 500, letterSpacing: '0.04em', color }}>{num}</span>
      <span style={{ width: 38, height: 1, background: `${color}`, opacity: 0.5 }} />
      <span style={{ fontFamily: MONO, fontSize: 17, letterSpacing: '0.34em', color: MUTED }}>{tag}</span>
    </div>
  );
}

function ModeTitle({ children, color, op, y }) {
  return (
    <div style={{ opacity: op, transform: `translateY(${y}px)`, willChange: 'transform,opacity' }}>
      <span style={{ fontFamily: SERIF, fontStyle: 'italic', fontWeight: 400, fontSize: 150, lineHeight: 0.92,
        letterSpacing: '-0.02em', color, textShadow: `0 0 70px ${withA(color,0.25)}` }}>{children}</span>
    </div>
  );
}

function ModeSub({ children, op, y }) {
  return (
    <div style={{ opacity: op, transform: `translateY(${y}px)`, willChange: 'transform,opacity', textAlign: 'center', maxWidth: 640 }}>
      <span style={{ fontFamily: SANS, fontWeight: 300, fontSize: 30, lineHeight: 1.5, color: 'color-mix(in oklch, var(--reel-ink) 62%, transparent)' }}>{children}</span>
    </div>
  );
}

// scene shell: vertically centered column with consistent rhythm
function SceneCol({ children }) {
  return (
    <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center', gap: 40, overflow: 'hidden', padding: '0 60px' }}>
      {children}
    </div>
  );
}

// staggered slide-up entrance helper
const rise = (localTime, delay, dist=70, dur=0.5) => {
  const p = clamp((localTime - delay) / dur, 0, 1);
  return { op: Easing.easeOutCubic(clamp(p * 2, 0, 1)), y: (1 - Easing.easeOutBack(p)) * dist };
};

// ── Scene 0: Intro — "four moves. one loop." ──────────────────────────────────
function Intro() {
  const { localTime } = useSprite();
  const fade = useFade();
  const eye = rise(localTime, 0.0, 40);
  const a   = rise(localTime, 0.22);
  const b   = rise(localTime, 0.52);
  const rule = clamp((localTime - 0.95) / 0.5, 0, 1);
  return (
    <SceneCol>
      <div style={{ opacity: eye.op * fade, transform: `translateY(${eye.y}px)`,
        display: 'flex', alignItems: 'center', gap: 14 }}>
        <span style={{ width: 8, height: 8, borderRadius: '50%', background: DEF, animation: 'pulseDot 1.4s ease-in-out infinite' }} />
        <span style={{ fontFamily: MONO, fontSize: 18, letterSpacing: '0.34em', color: DEF }}>CYBERRANGE · MODES</span>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
        <div style={{ opacity: a.op * fade, transform: `translateY(${a.y}px)` }}>
          <span style={{ fontFamily: SANS, fontWeight: 300, fontSize: 132, lineHeight: 0.96, letterSpacing: '-0.04em', color: INK }}>four moves.</span>
        </div>
        <div style={{ opacity: b.op * fade, transform: `translateY(${b.y}px)` }}>
          <span style={{ fontFamily: SERIF, fontStyle: 'italic', fontWeight: 400, fontSize: 132, lineHeight: 0.96, letterSpacing: '-0.015em', color: DEF }}>one loop.</span>
        </div>
      </div>
      <div style={{ height: 1, width: `${rule * 360}px`, background: withA(DEF,0.33), opacity: fade }} />
      <div style={{ opacity: clamp((localTime - 1.2) / 0.5, 0, 1) * fade }}>
        <span style={{ fontFamily: MONO, fontSize: 16, letterSpacing: '0.2em', color: MUTED }}>compete · drill · learn · review</span>
      </div>
    </SceneCol>
  );
}

// ── Scene 1: Battle (01) — live 1v1 duality ───────────────────────────────────
function BattleScene() {
  const { localTime } = useSprite();
  const fade = useFade();
  const eye = rise(localTime, 0.0, 40);
  const ttl = rise(localTime, 0.18);
  const sub = rise(localTime, 1.45, 40);
  const scan = (localTime * 0.55) % 1;
  const lP = clamp((localTime - 0.55) / 0.5, 0, 1);
  const rP = clamp((localTime - 0.72) / 0.5, 0, 1);
  const lX = -(1 - Easing.easeOutCubic(lP)) * 120;
  const rX =  (1 - Easing.easeOutCubic(rP)) * 120;
  const divGlow = 0.3 + 0.7 * Math.abs(Math.sin((localTime * Math.PI) / 1.1));
  return (
    <SceneCol>
      <ModeEyebrow num="01" tag="BATTLE · LIVE 1V1" color={ATK} op={eye.op * fade} y={eye.y} />
      <ModeTitle color={ATK} op={ttl.op * fade} y={ttl.y}>Battle.</ModeTitle>
      <div style={{ display: 'flex', alignItems: 'center', gap: 36, marginTop: 4 }}>
        <div style={{ transform: `translateX(${lX}px)`, opacity: Easing.easeOutCubic(clamp(lP*1.8,0,1)) * fade }}>
          <VMScreen color={ATK} label="YOU · ATTACK" op={1} scanT={scan} />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10, opacity: clamp((localTime-0.6)/0.4,0,1)*fade }}>
          <div style={{ width: 1, height: 56, background: `linear-gradient(to bottom, transparent, ${withA(DEF, (0.45*divGlow).toFixed(2))})` }} />
          <span style={{ fontFamily: MONO, fontSize: 18, fontWeight: 500, letterSpacing: '0.3em', color: MUTED }}>VS</span>
          <div style={{ width: 1, height: 56, background: `linear-gradient(to top, transparent, ${withA(DEF, (0.45*divGlow).toFixed(2))})` }} />
        </div>
        <div style={{ transform: `translateX(${rX}px)`, opacity: Easing.easeOutCubic(clamp(rP*1.8,0,1)) * fade }}>
          <VMScreen color={DEF} label="THEM · DEFEND" op={1} scanT={(scan+0.5)%1} />
        </div>
      </div>
      <ModeSub op={sub.op * fade} y={sub.y}>Fight live attacker-vs-defender matches on real, browser-based machines.</ModeSub>
    </SceneCol>
  );
}

// ── Scene 2: Practice (02) — drill skills, reps ───────────────────────────────
function PracticeScene() {
  const { localTime } = useSprite();
  const fade = useFade();
  const eye = rise(localTime, 0.0, 40);
  const ttl = rise(localTime, 0.18);
  const sub = rise(localTime, 1.7, 40);
  const skills = ['WEB', 'CLOUD', 'PRIVESC', 'DEFENSE'];
  return (
    <SceneCol>
      <ModeEyebrow num="02" tag="PRACTICE · REPS" color={DEF} op={eye.op * fade} y={eye.y} />
      <ModeTitle color={DEF} op={ttl.op * fade} y={ttl.y}>Practice.</ModeTitle>
      <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: 16, maxWidth: 700, marginTop: 4 }}>
        {skills.map((s, i) => {
          const lit = clamp((localTime - (0.6 + i * 0.32)) / 0.4, 0, 1);
          return (
            <div key={s} style={{
              opacity: (0.4 + 0.6 * lit) * fade,
              fontFamily: MONO, fontSize: 19, letterSpacing: '0.16em',
              color: lit > 0.5 ? DEF : MUTED,
              border: `1px solid ${lit > 0.5 ? DEF : 'color-mix(in oklch, var(--reel-ink) 15%, transparent)'}`,
              boxShadow: lit > 0.5 ? `0 0 22px -6px ${DEF}, inset 0 0 14px ${withA(DEF,0.10)}` : 'none',
              borderRadius: 999, padding: '12px 26px', display: 'flex', alignItems: 'center', gap: 12,
              transform: `scale(${0.92 + 0.08 * Easing.easeOutBack(lit)})`, transition: 'none' }}>
              {s}
              <span style={{ width: 16, height: 16, display: 'inline-flex', opacity: lit }}>
                <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke={DEF} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M3 8.5l3.2 3.2L13 4" strokeDasharray="22" strokeDashoffset={22 * (1 - lit)} />
                </svg>
              </span>
            </div>
          );
        })}
      </div>
      <ModeSub op={sub.op * fade} y={sub.y}>Drill specific skills across scenarios, again and again until they're reflex.</ModeSub>
    </SceneCol>
  );
}

// ── Scene 3: Learn (03) — guided path, progression ────────────────────────────
function LearnScene() {
  const { localTime } = useSprite();
  const fade = useFade();
  const eye = rise(localTime, 0.0, 40);
  const ttl = rise(localTime, 0.18);
  const sub = rise(localTime, 1.7, 40);
  const steps = ['FOUNDATIONS', 'WALKTHROUGHS', 'PROGRESSION', 'MASTERY'];
  const fillP = clamp((localTime - 0.7) / 1.4, 0, 1); // line fill 0..1
  const W = 720, n = steps.length;
  return (
    <SceneCol>
      <ModeEyebrow num="03" tag="LEARN · GUIDED" color={GOLD} op={eye.op * fade} y={eye.y} />
      <ModeTitle color={GOLD} op={ttl.op * fade} y={ttl.y}>Learn.</ModeTitle>
      <div style={{ position: 'relative', width: W, height: 96, marginTop: 8, opacity: clamp((localTime-0.5)/0.4,0,1)*fade }}>
        {/* base track */}
        <div style={{ position: 'absolute', left: 24, right: 24, top: 17, height: 2, background: 'color-mix(in oklch, var(--reel-ink) 12%, transparent)' }} />
        {/* filled track */}
        <div style={{ position: 'absolute', left: 24, top: 17, height: 2, width: `${(W - 48) * fillP}px`,
          background: GOLD, boxShadow: `0 0 12px ${GOLD}` }} />
        {steps.map((s, i) => {
          const at = i / (n - 1);
          const on = fillP >= at - 0.001;
          const x = 24 + (W - 48) * at;
          return (
            <div key={s} style={{ position: 'absolute', left: x, top: 0 }}>
              <span style={{ position: 'absolute', top: 9, left: -9, width: 18, height: 18, borderRadius: '50%',
                background: on ? GOLD : 'var(--reel-bg)', border: `2px solid ${on ? GOLD : 'color-mix(in oklch, var(--reel-ink) 20%, transparent)'}`,
                boxShadow: on ? `0 0 16px ${GOLD}` : 'none', transform: `scale(${on ? 1 : 0.7})` }} />
              <span style={{ position: 'absolute', top: 41, left: 0, transform: 'translateX(-50%)', whiteSpace: 'nowrap',
                fontFamily: MONO, fontSize: 13, letterSpacing: '0.16em',
                color: on ? 'color-mix(in oklch, var(--reel-ink) 70%, transparent)' : FAINT }}>{s}</span>
            </div>
          );
        })}
      </div>
      <ModeSub op={sub.op * fade} y={sub.y}>Follow guided labs built to take you from beginner to confident.</ModeSub>
    </SceneCol>
  );
}

// ── Scene 4: Analyze (04) — replay timeline + AI flags ────────────────────────
function AnalyzeScene() {
  const { localTime } = useSprite();
  const fade = useFade();
  const eye = rise(localTime, 0.0, 40);
  const ttl = rise(localTime, 0.18);
  const sub = rise(localTime, 1.7, 40);
  const W = 720;
  const playP = clamp((localTime - 0.6) / 2.0, 0, 1);
  const markers = [
    { at: 0.22, c: DEF, lbl: 'good call' },
    { at: 0.48, c: ATK, lbl: 'missed' },
    { at: 0.78, c: GOLD, lbl: 'slow' },
  ];
  const head = 24 + (W - 48) * playP;
  return (
    <SceneCol>
      <ModeEyebrow num="04" tag="ANALYZE · REVIEW" color={CYAN} op={eye.op * fade} y={eye.y} />
      <ModeTitle color={CYAN} op={ttl.op * fade} y={ttl.y}>Analyze.</ModeTitle>
      <div style={{ position: 'relative', width: W, height: 110, marginTop: 8, opacity: clamp((localTime-0.5)/0.4,0,1)*fade }}>
        {/* timeline track */}
        <div style={{ position: 'absolute', left: 24, right: 24, top: 54, height: 4, borderRadius: 2, background: 'color-mix(in oklch, var(--reel-ink) 10%, transparent)' }} />
        <div style={{ position: 'absolute', left: 24, top: 54, height: 4, borderRadius: 2, width: `${(W-48)*playP}px`, background: `${CYAN}` }} />
        {/* flagged moments */}
        {markers.map((m, i) => {
          const x = 24 + (W - 48) * m.at;
          const shown = playP >= m.at - 0.001;
          return (
            <div key={i} style={{ position: 'absolute', left: x, top: 0,
              opacity: shown ? fade : 0.18 * fade }}>
              <span style={{ position: 'absolute', top: 20, left: 0, fontFamily: MONO, fontSize: 12, letterSpacing: '0.12em', color: m.c, whiteSpace: 'nowrap',
                transform: `translateX(-50%) translateY(${shown ? 0 : 6}px)`, opacity: shown ? 1 : 0 }}>{m.lbl}</span>
              <span style={{ position: 'absolute', top: 50, left: -6, width: 12, height: 12, borderRadius: '50%', background: m.c,
                boxShadow: shown ? `0 0 14px ${m.c}` : 'none' }} />
            </div>
          );
        })}
        {/* playhead */}
        <div style={{ position: 'absolute', left: head, top: 38, transform: 'translateX(-50%)' }}>
          <div style={{ width: 2, height: 36, background: INK, boxShadow: '0 0 8px rgba(255,255,255,0.6)' }} />
          <div style={{ position: 'absolute', top: -7, left: '50%', transform: 'translateX(-50%)', width: 10, height: 10, borderRadius: '50%', background: INK }} />
        </div>
      </div>
      <ModeSub op={sub.op * fade} y={sub.y}>Replay every match with AI feedback on your commands, decisions, and mistakes.</ModeSub>
    </SceneCol>
  );
}

// ── Scene 5: AI Coach (adapted from battle-reel CoachScene) ───────────────────
function CoachScene() {
  const { localTime } = useSprite();
  const fade = useFade();
  const l1 = rise(localTime, 0.0, 80);
  const l2 = rise(localTime, 0.45, 80);
  const subP = clamp((localTime - 1.0) / 0.45, 0, 1);
  const ringP = clamp((localTime - 0.2) / 0.7, 0, 1);
  return (
    <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 26, overflow: 'hidden' }}>
      {/* watching-eye ring */}
      <div style={{ position: 'relative', width: 120, height: 120, marginBottom: 8, opacity: ringP * fade }}>
        <div style={{ position: 'absolute', inset: 0, borderRadius: '50%', border: `1px solid ${withA(DEF,0.33)}` }} />
        <div style={{ position: 'absolute', inset: 22, borderRadius: '50%', border: `1px solid ${withA(DEF,0.25)}` }} />
        <div style={{ position: 'absolute', top: '50%', left: '50%', width: 16, height: 16, marginLeft: -8, marginTop: -8,
          borderRadius: '50%', background: DEF, boxShadow: `0 0 20px 4px ${DEF}`, animation: 'pulseDot 1.3s ease-in-out infinite' }} />
        <div style={{ position: 'absolute', inset: -10, borderRadius: '50%', border: `1px solid ${DEF}`,
          opacity: (1 - ((localTime*0.8)%1)) * 0.6, transform: `scale(${1 + ((localTime*0.8)%1)*0.3})` }} />
      </div>
      <div style={{ opacity: l1.op * fade, transform: `translateY(${l1.y}px)` }}>
        <span style={{ fontFamily: SANS, fontWeight: 300, fontSize: 116, lineHeight: 0.9, letterSpacing: '-0.03em', color: INK }}>AI coach.</span>
      </div>
      <div style={{ opacity: l2.op * fade, transform: `translateY(${l2.y}px)` }}>
        <span style={{ fontFamily: SERIF, fontStyle: 'italic', fontWeight: 400, fontSize: 116, lineHeight: 0.9, letterSpacing: '-0.012em', color: DEF }}>in your corner.</span>
      </div>
      <div style={{ marginTop: 26, display: 'flex', alignItems: 'center', gap: 16, opacity: Easing.easeOutCubic(subP) * fade }}>
        <span style={{ width: 10, height: 10, borderRadius: '50%', background: DEF, boxShadow: `0 0 14px 3px ${withA(DEF,0.6)}`, animation: 'pulseDot 1.3s ease-in-out infinite' }} />
        <span style={{ fontFamily: MONO, fontSize: 17, letterSpacing: '0.2em', color: MUTED }}>WATCHING EVERY MOVE · LIVE</span>
      </div>
    </div>
  );
}

// ── Scene 6: Outro loop card — the four moves + CTA ───────────────────────────
function Outro() {
  const { localTime } = useSprite();
  const fade = 1; // last scene — hold on the four modes, never fade out
  const rows = [
    { n: '01', t: 'Battle',   d: 'live 1v1',   c: ATK },
    { n: '02', t: 'Practice', d: 'targeted reps', c: DEF },
    { n: '03', t: 'Learn',    d: 'guided labs', c: GOLD },
    { n: '04', t: 'Analyze',  d: 'ai review',   c: CYAN },
  ];
  const head = rise(localTime, 0.0, 40);
  const cta  = rise(localTime, 1.35, 30);
  return (
    <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 30, overflow: 'hidden', padding: '0 70px' }}>
      <div style={{ opacity: head.op * fade, transform: `translateY(${head.y}px)`, textAlign: 'center' }}>
        <span style={{ fontFamily: SERIF, fontStyle: 'italic', fontWeight: 400, fontSize: 86, lineHeight: 1.05, letterSpacing: '-0.015em', color: INK }}>
          One platform.<br/><em style={{ color: DEF }}>Four ways to get better.</em>
        </span>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 0, width: '100%', maxWidth: 620, marginTop: 6 }}>
        {rows.map((r, i) => {
          const a = rise(localTime, 0.45 + i * 0.16, 34);
          return (
            <div key={r.n} style={{ opacity: a.op * fade, transform: `translateY(${a.y}px)`,
              display: 'flex', alignItems: 'center', gap: 22, padding: '18px 4px',
              borderBottom: i < 3 ? '1px solid color-mix(in oklch, var(--reel-ink) 8%, transparent)' : 'none' }}>
              <span style={{ fontFamily: MONO, fontSize: 16, color: r.c, width: 30 }}>{r.n}</span>
              <span style={{ fontFamily: SERIF, fontStyle: 'italic', fontWeight: 400, fontSize: 52, lineHeight: 1, color: INK, flex: 1 }}>{r.t}</span>
              <span style={{ fontFamily: MONO, fontSize: 14, letterSpacing: '0.18em', textTransform: 'uppercase', color: MUTED }}>{r.d}</span>
              <span style={{ width: 9, height: 9, borderRadius: '50%', background: r.c, boxShadow: `0 0 12px ${r.c}` }} />
            </div>
          );
        })}
      </div>
      <div style={{ opacity: cta.op * fade, transform: `translateY(${cta.y}px)`, marginTop: -10 }}>
        <button onClick={() => { try { window.parent.postMessage({ crNav: 'join' }, '*'); } catch(e){} }}
          style={{ fontFamily: MONO, fontSize: 18, fontWeight: 500, letterSpacing: '0.14em', textTransform: 'uppercase',
          color: '#0a0a0a', background: DEF, borderRadius: 999, padding: '18px 52px', display: 'inline-block', border: 'none',
          cursor: 'pointer', boxShadow: `0 0 40px -8px ${DEF}` }}>Pick your move →</button>
      </div>
    </div>
  );
}

// ── Composition ───────────────────────────────────────────────────────────────
// timeline:
//   0.0 – 3.0   Intro
//   3.0 – 6.6   Battle
//   6.6 – 10.0  Practice
//  10.0 – 13.4  Learn
//  13.4 – 16.8  Analyze
//  16.8 – 20.6  Coach
//  20.6 – 24.5  Outro
const DURATION = 24.5;

function ModesReel() {
  const t = useTime();
  // tint the mesh toward each mode's accent feel — keep subtle
  return (
    <div style={{ position: 'absolute', inset: 0 }}>
      <DarkMesh phase={1} tealStrength={1} />

      <Sprite start={0.0}  end={3.0}>  <Intro />        </Sprite>
      <Sprite start={3.0}  end={6.6}>  <BattleScene />  </Sprite>
      <Sprite start={6.6}  end={10.0}> <PracticeScene /></Sprite>
      <Sprite start={10.0} end={13.4}> <LearnScene />   </Sprite>
      <Sprite start={13.4} end={16.8}> <AnalyzeScene /> </Sprite>
      <Sprite start={16.8} end={20.6}> <CoachScene />   </Sprite>
      <Sprite start={20.6} end={24.5}> <Outro />        </Sprite>

      {/* Film grain (lifted from battle-reel) */}
      <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none',
        backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.6'/></svg>\")",
        opacity: 0.035, mixBlendMode: 'screen' }} />

      {/* subtle vignette to seat the panel */}
      <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none',
        boxShadow: 'inset 0 0 160px 30px rgba(0,0,0,0.55)' }} />
    </div>
  );
}

function App() {
  return (
    <StageClean width={1280} height={720} duration={DURATION} background="var(--reel-bg)" loop={false}>
      <ModesReel />
    </StageClean>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
